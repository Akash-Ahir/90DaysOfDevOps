apiVersion: v1
kind: Pod
metadata:
  name: startup
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command:
      - sh
      - -c
      - sleep 20; touch /tmp/started; sleep 600

    startupProbe:
      exec:
        command:
        - cat
        - /tmp/started
      periodSeconds: 5
      failureThreshold: 2

    livenessProbe:
      exec:
        command:
        - cat
        - /tmp/started
      periodSeconds: 5
