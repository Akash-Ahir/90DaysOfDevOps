apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: nginx-headless
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
      - name: nginx
        image: nginx:latest

        ports:
        - containerPort: 80

        volumeMounts:
        - name: web-volume
          mountPath: /usr/share/nginx/html

  volumeClaimTemplates:
  - metadata:
      name: web-volume

    spec:
      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: 100Mi
